# ─────────────────────────────────────────────────────────────
#  Decap CMS configuration untuk OHMEGA
#  Halaman admin: /admin  (load dari /admin/index.html)
#
#  Login:
#    Backend = github, OAuth App callback ke https://ohmega.web.id/admin/
#    Isi GITHUB_CLIENT_ID setelah membuat OAuth App di
#    https://github.com/settings/developers
#
#  Publish flow:
#    Edit → simpan → commit ke branch `main` → Cloudflare Pages rebuild.
#    Tidak butuh branch terpisah karena situs statis tanpa CI.
# ─────────────────────────────────────────────────────────────

backend:
  name: github
  repo: eiaiproject/Ohmega
  branch: main
  # open_authoring: true   # aktifkan kalau mau izinkan non-collaborator login
  # base_url + auth_endpoint = URL Worker OAuth bridge.
  # Decap GitHub backend construct popup URL: ${base_url}/${auth_endpoint}?provider=github&...
  # Worker di scripts/ohmega-cms-auth/ route /auth (handle GitHub OAuth redirect).
  base_url: https://ohmega.eiai.workers.dev
  auth_endpoint: auth

# Tampilkan editor ini sebagai identitas pengguna di GitHub commit
publish_mode: editorial_workflow
media_folder: "public/images/blog"
public_folder: "/images/blog"

# Tipe data yang dapat diedit
collections:
  # ───────────────────────────────────────────────────────────
  #  1) HARGA PRODUK
  #  Single-file collection: hanya satu record di prices.yaml
  # ───────────────────────────────────────────────────────────
  - name: "prices"
    label: "Harga Produk"
    label_singular: "Konfigurasi Harga"
    description: "Atur harga jual ketiga kemasan telur OHMEGA. Klik 'Publish' untuk menyimpan & deploy."
    files:
      - name: "prices"
        label: "Harga"
        file: "content/prices.yaml"
        format: "yaml"
        extension: "yaml"
        fields:
          - {label: "Harga Isi 4 (Rp)", name: "pack4", widget: "number", value_type: "int", min: 0, hint: "Harga per kemasan isi 4 butir."}
          - {label: "Harga Isi 10 (Rp)", name: "pack10", widget: "number", value_type: "int", min: 0, hint: "Harga per kemasan isi 10 butir."}
          - {label: "Harga Isi 30 (Rp)", name: "pack30", widget: "number", value_type: "int", min: 0, hint: "Harga per kemasan isi 30 butir."}

  # ───────────────────────────────────────────────────────────
  #  2) ARTIKEL EDUKASI
  #  Folder collection: satu file MD per artikel di content/articles/
  # ───────────────────────────────────────────────────────────
  - name: "articles"
    label: "Artikel Edukasi"
    label_singular: "Artikel"
    description: "Tulis artikel edukasi terkait telur omega, gizi, resep, dll."
    folder: "content/articles"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}}: {{date | date('DD MMM YYYY')}}"
    sortable_fields: ["date", "title"]
    view_filters:
      - {label: "Published", field: "status", pattern: "published"}
      - {label: "Draft", field: "status", pattern: "draft"}
    fields:
      - {label: "Judul", name: "title", widget: "string", hint: "Judul artikel, akan tampil sebagai <h1>."}
      - {label: "Slug", name: "slug", widget: "string", hint: "URL bagian akhir: /blog/<slug>. Hanya huruf kecil, angka, dan tanda hubung."}
      - {label: "Tanggal Publish", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD"}
      - {label: "Ringkasan", name: "description", widget: "text", hint: "1-2 kalimat, tampil di kartu & meta description."}
      - {label: "Hero Image", name: "hero", widget: "image", allow_multiple: false, hint: "Gambar utama artikel, rekomendasi 1200x630px."}
      - {label: "Hero Image Alt", name: "heroAlt", widget: "string", default: "", hint: "Teks alternatif untuk aksesibilitas."}
      - {label: "Tag", name: "tags", widget: "list", required: false, hint: "Contoh: Omega-3, Gizi, Resep."}
      - {label: "Status", name: "status", widget: "select", options: ["draft", "published"], default: "draft", hint: "Hanya artikel 'published' yang tampil di /blog."}
      - {label: "SEO Title", name: "seoTitle", widget: "string", required: false, hint: "Judul untuk Google & OG. Kosongkan untuk pakai judul artikel."}
      - {label: "SEO Description", name: "seoDescription", widget: "text", required: false, hint: "Deskripsi untuk Google & OG. Maks 160 karakter."}
      - {label: "Isi Artikel", name: "body", widget: "markdown", hint: "Tulis dalam Markdown. Heading utama otomatis jadi <h2>."}
