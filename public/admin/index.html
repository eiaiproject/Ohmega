<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>OHMEGA Admin</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Brand font (Nunito Sans, self-hosted) -->
    <style>
      @font-face {
        font-family: 'Nunito Sans';
        src: url('/fonts/nunito-sans-regular.woff2') format('woff2');
        font-weight: 400; font-style: normal; font-display: swap;
      }
      @font-face {
        font-family: 'Nunito Sans';
        src: url('/fonts/nunito-sans-semibold.woff2') format('woff2');
        font-weight: 600; font-style: normal; font-display: swap;
      }
      @font-face {
        font-family: 'Nunito Sans';
        src: url('/fonts/nunito-sans-bold.woff2') format('woff2');
        font-weight: 700; font-style: normal; font-display: swap;
      }
      @font-face {
        font-family: 'Nunito Sans';
        src: url('/fonts/nunito-sans-extrabold.woff2') format('woff2');
        font-weight: 800; font-style: normal; font-display: swap;
      }
    </style>

    <!-- Brand theme: samakan warna & font Decap UI dengan situs publik -->
    <link rel="stylesheet" href="/admin/theme.css" />
  </head>
  <body>
    <!-- Decap CMS: load UI dari CDN, mount ke body. Konfigurasi ada di /admin/config.yml. -->
    <script src="https://unpkg.com/decap-cms@^3.7.3/dist/decap-cms.js"></script>
    <script src="/admin/branding.js" defer></script>
  </body>
</html>
