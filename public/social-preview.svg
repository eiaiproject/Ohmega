<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="OHMEGA — Telur Omega untuk keluarga di Sidoarjo">
  <!-- Latar belakang terang (krem, seperti body situs) -->
  <rect width="1200" height="630" fill="#FFFDF6"/>

  <!-- Aksen lembut -->
  <circle cx="1130" cy="40" r="230" fill="#DDEDE3" opacity="0.55"/>
  <circle cx="85" cy="610" r="140" fill="#F5A900" opacity="0.10"/>

  <!-- Logo OHMEGA warna asli (seperti di header situs; di-inline saat dirender) -->
  <image href="logo/ohmega-logo.svg" x="80" y="60" width="420" height="73" preserveAspectRatio="xMidYMid meet"/>

  <!-- Pernyataan utama -->
  <text x="82" y="302" font-family="Helvetica Neue, Arial, sans-serif" font-weight="800" font-size="44" fill="#173F2C">Telur Omega,</text>
  <text x="82" y="360" font-family="Helvetica Neue, Arial, sans-serif" font-weight="800" font-size="44" fill="#173F2C">Antar Langsung ke Rumah</text>

  <!-- Tagline -->
  <text x="84" y="428" font-family="Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="30" fill="#F5A900">Kaya Protein, Rendah Kolesterol</text>

  <rect x="84" y="456" width="120" height="5" rx="2.5" fill="#F5A900"/>

  <!-- Informasi area layanan -->
  <text x="84" y="504" font-family="Helvetica Neue, Arial, sans-serif" font-size="23" fill="#607067">Area layanan Sidoarjo — dikonfirmasi melalui WhatsApp</text>

  <!-- Domain -->
  <text x="82" y="576" font-family="Helvetica Neue, Arial, sans-serif" font-weight="600" font-size="21" letter-spacing="1" fill="#245D40">ohmega.web.id</text>

  <!-- Kartu produk (seperti kartu produk di situs) -->
  <rect x="706" y="96" width="416" height="416" rx="26" fill="#FFFFFF" stroke="#F5A900" stroke-width="8"/>
  <rect x="714" y="104" width="400" height="400" fill="#F1F8F3"/>

  <!-- Foto produk isi 10 (di-inline saat dirender) -->
  <image href="images/product-10.webp" x="714" y="104" width="400" height="400" preserveAspectRatio="xMidYMid slice"/>

</svg>
